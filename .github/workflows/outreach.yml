name: Arctos outreach

# Sends queued outreach (outreach/batch-*.json) from aldo@arctoslaunchpad.com
# through Brevo, up to ten emails per run (GitHub runs the schedule only a few
# times a day, so runs are also started by the daily outreach routine), weekdays 9:00-16:30
# Calgary time, at most 50 a day. The send window is enforced in scripts/send-outreach.mjs.
on:
  schedule:
    - cron: "11,26,41,56 14-23 * * 1-5"
  workflow_dispatch:
    inputs:
      send_now:
        description: Send now, even outside the weekday send window
        type: boolean
        default: false

permissions:
  contents: write
  # Keyless sign-in to HQ, to text Aldo when a run starts sending and how it ended.
  id-token: write

concurrency:
  group: outreach
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Send the next queued email
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          OUTREACH_SEND_NOW: ${{ inputs.send_now }}
        run: node scripts/send-outreach.mjs
      # The script reports its own start and end; this covers it dying before it could.
      - name: Text Aldo if the run crashed
        if: failure()
        run: |
          [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ ! -e "$RUNNER_TEMP/outreach-reported" ] || exit 0
          oidc=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=arctos-hq-outreach" | jq -r .value) || exit 0
          curl -sf -X POST https://arctoslaunchpad.com/api/hq/alerts/outreach \
            -H "Authorization: Bearer $oidc" -H 'Content-Type: application/json' \
            -d "{\"event\":\"crashed\",\"runUrl\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}" > /dev/null || echo "::warning::Couldn't text Aldo."
      - name: Record what was sent
        if: always()
        run: |
          git config user.name "arctos-outreach"
          git config user.email "aldo@arctoslaunchpad.com"
          git add outreach/sent.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Record outreach sends [skip ci]"
          git push
