name: Operations clock

# GitHub runs scheduled workflows late or not at all when it is busy: in one
# day the four-times-an-hour ops schedule fired 4 times out of 96. This clock
# keeps time instead. One run stays awake for just under six hours, starts
# Operations hourly at :07 and :37 and Operations daily at 3, 6, 7 and 8 am
# Calgary (09, 12, 13, 14 UTC), then starts the next clock before it ends.
# Every minute it also starts hq-agent.yml for each new HQ agent job (jobs
# the HQ bot saves in arctos-hq; ops/agent-jobs.ts). On weekdays it starts
# outreach.yml (Arctos and Vow Motion cold email) at :12 and :42 from 7 am to
# 5 pm Calgary; that script keeps each campaign's own send window and cap,
# so these are the only starts outreach needs. Its own schedule only
# restarts the chain if it ever breaks. A dispatch made
# with the workflow's token is one of the few events GitHub lets start a run.
# Public repository: runner minutes are free.
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  # Keyless sign-in to arctos-hq to look for new HQ agent jobs.
  id-token: write

# Exactly one clock at a time; a second one waits until the first hands over.
concurrency:
  group: ops-clock
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: ops/agent-jobs.ts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Keep time
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          READY: ${{ secrets.ANTHROPIC_API_KEY != '' && secrets.FIREBASE_SERVICE_ACCOUNT != '' && secrets.IG_TOKEN_CALGARYDAILY != '' }}
        run: |
          # Without the ops secrets the ops runs are skipped, but HQ agent jobs still start.
          [ "$READY" = true ] || echo "::notice title=Ops idle::The ops secrets aren't in this repository yet; only HQ agent jobs run."
          start() { gh workflow run "$1" && echo "$(date -u +%H:%M) started $1" || echo "::warning::couldn't start $1"; }
          end=$((SECONDS + 5 * 3600 + 45 * 60))
          last_hourly=""; last_daily=""; last_outreach=""
          while [ "$SECONDS" -lt "$end" ]; do
            h=$(date -u +%H); m=$((10#$(date -u +%M)))
            if [ "$READY" = true ] && [ $((m % 30)) -ge 7 ]; then
              key="$(date -u +%Y%m%d)$h-$((m / 30))"
              [ "$key" != "$last_hourly" ] && { start ops-hourly.yml; last_hourly=$key; }
            fi
            if [ "$READY" = true ]; then
              case "$h" in 09|12|13|14)
                if [ "$m" -ge 5 ]; then
                  key="$(date -u +%Y%m%d)$h"
                  [ "$key" != "$last_daily" ] && { start ops-daily.yml; last_daily=$key; }
                fi;;
              esac
            fi
            # Outreach: weekdays 13:00-23:59 UTC (7 am-5 pm Calgary), twice an hour.
            dow=$(date -u +%u)
            if [ "$dow" -le 5 ] && [ $((10#$h)) -ge 13 ] && [ $((m % 30)) -ge 12 ]; then
              key="$(date -u +%Y%m%d)$h-$((m / 30))"
              [ "$key" != "$last_outreach" ] && { gh workflow run outreach.yml --ref arctos-launchpad && echo "$(date -u +%H:%M) started outreach" || echo "::warning::couldn't start outreach"; last_outreach=$key; }
            fi
            for job in $(node ops/agent-jobs.ts pending || true); do
              gh workflow run hq-agent.yml -f job="$job" && echo "$(date -u +%H:%M) started an HQ agent job" || echo "::warning::couldn't start HQ agent job $job"
            done
            sleep 60
          done
          start ops-clock.yml
